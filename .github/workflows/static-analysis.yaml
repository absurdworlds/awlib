name: static-analysis

on:
  push:
  pull_request:

jobs:
  static-analysis:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang-tidy
            deps: clang-tidy
            cmake: >-
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DAW_CLANG_TIDY:BOOL=ON
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.deps }} liblua5.4-dev

      # .clang-tidy names every check, and clang-tidy skips a name it does
      # not know without saying so
      - name: Check .clang-tidy
        if: matrix.name == 'clang-tidy'
        run: clang-tidy --verify-config

      - name: Configure
        run: >
          cmake -S . -B build
          -GNinja
          -DCMAKE_BUILD_TYPE=Debug
          ${{ matrix.cmake }}
          -DAW_ENABLE_GRAPHICS:BOOL=OFF
          -DAW_ENABLE_ASSERT:BOOL=OFF
          -DAW_ENABLE_HUDF:BOOL=ON
          -DAW_ENABLE_LUA:BOOL=ON
          -DAW_ENABLE_SOUND:BOOL=ON

      - name: Analyse
        shell: bash
        run: cmake --build build -- -k 0 2>&1 | tee build/analyse.log

      - name: Report
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/tidy-report.py build/analyse.log --sarif build/${{ matrix.name }}.sarif

      - name: Upload SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/${{ matrix.name }}.sarif
          category: ${{ matrix.name }}

  # GCC's analyser and cppcheck have nothing left to report, so rather than
  # listing findings the way clang-tidy does above, they fail on one: that
  # is what keeps them at nothing. They are jobs of their own because
  # tidy-report.py reads clang-tidy's diagnostics specifically.
  gcc-analyzer:
    name: gcc -fanalyzer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y liblua5.4-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -GNinja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DAW_GCC_ANALYZER:BOOL=ON
          -DAW_ANALYZER_WERROR:BOOL=ON
          -DAW_ENABLE_GRAPHICS:BOOL=OFF
          -DAW_ENABLE_ASSERT:BOOL=OFF
          -DAW_ENABLE_HUDF:BOOL=ON
          -DAW_ENABLE_LUA:BOOL=ON
          -DAW_ENABLE_SOUND:BOOL=ON

      - name: Analyse
        run: cmake --build build

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cppcheck liblua5.4-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -GNinja
          -DCMAKE_BUILD_TYPE=Debug
          -DAW_CPPCHECK:BOOL=ON
          -DAW_ANALYZER_WERROR:BOOL=ON
          -DAW_ENABLE_GRAPHICS:BOOL=OFF
          -DAW_ENABLE_ASSERT:BOOL=OFF
          -DAW_ENABLE_HUDF:BOOL=ON
          -DAW_ENABLE_LUA:BOOL=ON
          -DAW_ENABLE_SOUND:BOOL=ON

      - name: Analyse
        run: cmake --build build
