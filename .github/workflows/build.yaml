name: normal-build

on:
  push:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so that one set of steps works on every runner
        shell: bash
    env:
      # Baseline configuration. Every option is spelled out, so that a change
      # to an the default cannot silently alter what CI covers
      CMAKE_COMMON: >-
        -DAW_ENABLE_GRAPHICS:BOOL=OFF
        -DAW_ENABLE_HUDF:BOOL=ON
        -DAW_ENABLE_ASSERT:BOOL=OFF
        -DAW_NO_BUILTINS:BOOL=OFF
        -DAW_MAKE_DEMOS:BOOL=ON
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows (x86)
            os: windows-latest
            cmake: -A Win32 -DAW_ENABLE_ASSERT:BOOL=ON
          - name: windows (x64)
            os: windows-latest
            cmake: -A x64 -DAW_ENABLE_ASSERT:BOOL=ON

          - name: ubuntu (gcc)
            os: ubuntu-24.04
            packages: liblua5.4-dev
            cmake: >-
              -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
              -DAW_ENABLE_LUA:BOOL=ON
          - name: ubuntu (clang)
            os: ubuntu-24.04
            packages: liblua5.4-dev
            cmake: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DAW_ENABLE_LUA:BOOL=ON
          # The fallbacks are plain C++ with no per-compiler paths, so one
          # job is enough to cover them.
          - name: ubuntu (gcc, no-builtins)
            os: ubuntu-24.04
            packages: liblua5.4-dev
            cmake: >-
              -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
              -DAW_ENABLE_LUA:BOOL=ON
              -DAW_NO_BUILTINS:BOOL=ON

          # Sanitizers. FAIL_FAST because a diagnostic that only prints is
          # a diagnostic CI ignores. gcc ships its runtimes with the
          # compiler; clang keeps them in libclang-rt.
          - name: ubuntu (gcc, asan+ubsan)
            os: ubuntu-24.04
            packages: liblua5.4-dev
            cmake: >-
              -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
              -DCMAKE_BUILD_TYPE=Debug
              -DAW_ENABLE_LUA:BOOL=ON
              -DAW_SANITIZERS=address,undefined
              -DAW_SANITIZER_FAIL_FAST:BOOL=ON
          # The two implementations do not find quite the same things:
          # clang's UBSan has more checks, and only clang implements
          # -fsanitize=function.
          - name: ubuntu (clang, asan+ubsan)
            os: ubuntu-24.04
            packages: liblua5.4-dev clang libclang-rt-18-dev
            cmake: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_BUILD_TYPE=Debug
              -DAW_ENABLE_LUA:BOOL=ON
              -DAW_SANITIZERS=address,undefined
              -DAW_SANITIZER_FAIL_FAST:BOOL=ON
          # TSan needs the address space to itself, so it gets its own job.
          - name: ubuntu (clang, tsan)
            os: ubuntu-24.04
            packages: liblua5.4-dev clang libclang-rt-18-dev
            cmake: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_BUILD_TYPE=Debug
              -DAW_ENABLE_LUA:BOOL=ON
              -DAW_SANITIZERS=thread
              -DAW_SANITIZER_FAIL_FAST:BOOL=ON

          - name: macos
            os: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Configure
        run: cmake -S . -B build $CMAKE_COMMON ${{ matrix.cmake }}
      - name: Build
        run: cmake --build build
      - name: Test
        # -C is only meaningful for the multi-config generator on Windows
        run: ctest --test-dir build -C Debug --output-on-failure

  graphics:
    name: graphics (${{ matrix.loader }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: glx, use_egl: "OFF" }
          - { loader: egl, use_egl: "ON" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libgl1-mesa-dev
          libegl-dev
          libglfw3-dev
          libpng-dev
          libgl1-mesa-dri
      - name: Configure
        run: >
          cmake -S . -B build
          -DAW_ENABLE_GRAPHICS:BOOL=ON
          -DAW_ENABLE_IMAGE:BOOL=ON
          -DAW_ENABLE_MESH:BOOL=ON
          -DAW_ENABLE_HUDF:BOOL=ON
          -DAW_ENABLE_ASSERT:BOOL=OFF
          -DAW_NO_BUILTINS:BOOL=OFF
          -DAW_MAKE_DEMOS:BOOL=ON
          -DAW_GL_USE_EGL:BOOL=${{ matrix.use_egl }}
      - name: Build
        run: >
          cmake --build build --target
          awgl awgraphics awgraphics-demo test_graphics test_graphics_gl
      - name: Test
        # No GPU on the runners, fall back to Mesa's software rasteriser
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: ctest --test-dir build -R graphics --output-on-failure
